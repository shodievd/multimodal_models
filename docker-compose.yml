version: '3.8'

services:
  app:
    build: .
    image: multimodal-app:latest
    container_name: multimodal-app
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./hf_cache:/root/.cache/huggingface
      - ./app/static/uploads:/app/static/uploads
      - ./app/static/generated:/app/static/generated
      - ./app:/app
    environment:
      - DEVICE=${DEVICE:-cpu}
      - MODEL_SIZE=${MODEL_SIZE:-small}
      - PORT=${PORT:-5000}
      - FLASK_DEBUG=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
